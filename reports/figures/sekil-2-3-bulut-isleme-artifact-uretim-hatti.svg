<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="450" viewBox="0 0 1400 450" role="img" aria-labelledby="sekil-2-3-title sekil-2-3-desc">
  <title id="sekil-2-3-title">Bulut İşleme ve Artifact Üretim Hattı</title>
  <desc id="sekil-2-3-desc">API büyük dosyayı taşımak yerine imzalı URL ve doğrulama sözleşmesini yönetir.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334E68"/>
    </marker>
    <style>
      .title { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 31px; font-weight: 700; fill: #1F2937; }
      .label { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 20px; font-weight: 700; fill: #1F2937; }
      .cardTitle { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 19px; font-weight: 700; fill: #1F2937; }
      .cardSub { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 500; fill: #526375; }
      .badge { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .miniLabel { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 15px; font-weight: 700; fill: #1F2937; }
      .small { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 14px; font-weight: 600; fill: #526375; }
      .chip { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 14px; font-weight: 700; fill: #1F2937; }
      .note { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 17px; font-weight: 500; fill: #526375; }
      .lane { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>
  <rect x="0" y="0" width="1400" height="450" fill="#FFFFFF"/>
  <text x="700.0" y="56" text-anchor="middle" class="title">Bulut İşleme ve Artifact Üretim Hattı</text>
<rect x="60" y="130" width="245" height="112" rx="8" fill="#EAF2F8" stroke="#2E5D7D" stroke-width="2"/>
<circle cx="91" cy="161" r="18" fill="#24475F"/>
<text x="91" y="167" text-anchor="middle" class="badge">1</text>
<text text-anchor="middle" class="cardTitle"><tspan x="182.5" y="180.4">Upload Init</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="182.5" y="200.64">POST /uploads/init</tspan><tspan x="182.5" y="220.64">signed PUT URL</tspan></text>
<line x1="315" y1="186" x2="375" y2="186" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="385" y="130" width="245" height="112" rx="8" fill="#FFF7E8" stroke="#D18A1E" stroke-width="2"/>
<circle cx="416" cy="161" r="18" fill="#9A6514"/>
<text x="416" y="167" text-anchor="middle" class="badge">2</text>
<text text-anchor="middle" class="cardTitle"><tspan x="507.5" y="180.4">Mobil PUT</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="507.5" y="200.64">metadata.json +</tspan><tspan x="507.5" y="220.64">source video</tspan></text>
<line x1="640" y1="186" x2="700" y2="186" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="710" y="130" width="245" height="112" rx="8" fill="#EAF7F0" stroke="#2C8B5F" stroke-width="2"/>
<circle cx="741" cy="161" r="18" fill="#1F6746"/>
<text x="741" y="167" text-anchor="middle" class="badge">3</text>
<text text-anchor="middle" class="cardTitle"><tspan x="832.5" y="180.4">Complete</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="832.5" y="200.64">size + metadata</tspan><tspan x="832.5" y="220.64">validation</tspan></text>
<line x1="965" y1="186" x2="1025" y2="186" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1035" y="130" width="245" height="112" rx="8" fill="#EEF0FF" stroke="#5056D6" stroke-width="2"/>
<circle cx="1066" cy="161" r="18" fill="#383DA8"/>
<text x="1066" y="167" text-anchor="middle" class="badge">4</text>
<text text-anchor="middle" class="cardTitle"><tspan x="1157.5" y="180.4">Process Job</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="1157.5" y="200.64">worker +</tspan><tspan x="1157.5" y="220.64">export files</tspan></text>
<rect x="330" y="300" width="285" height="88" rx="8" fill="#E8F7F8" stroke="#1B7F8C" stroke-width="2"/>
<text text-anchor="middle" class="cardTitle"><tspan x="472.5" y="328.1">S3 Uyumlu</tspan><tspan x="472.5" y="351.1">Depolama</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="472.5" y="363.36">object key üzerinden erişim</tspan></text>
<rect x="790" y="300" width="315" height="88" rx="8" fill="#EAF7F0" stroke="#2C8B5F" stroke-width="2"/>
<text text-anchor="middle" class="cardTitle"><tspan x="947.5" y="339.6">Artifact Seti</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="947.5" y="363.36">BVH + JSON raporlar + preview</tspan></text>
<path d="M 508 244 L 508 290" fill="none" stroke="#334E68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1035 244 C 1020 275 985 290 948 300" fill="none" stroke="#334E68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<line x1="625" y1="344" x2="780" y2="344" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<text text-anchor="middle" class="note"><tspan x="700.0" y="412.0">API büyük dosyayı taşımak yerine imzalı URL ve doğrulama sözleşmesini yönetir.</tspan></text>
</svg>
