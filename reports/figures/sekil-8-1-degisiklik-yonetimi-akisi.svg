<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="590" viewBox="0 0 1400 590" role="img" aria-labelledby="sekil-8-1-title sekil-8-1-desc">
  <title id="sekil-8-1-title">Değişiklik Yönetimi Akışı</title>
  <desc id="sekil-8-1-desc">Her değişiklik katman etkisiyle birlikte test edilir ve geri dönüş planı olmadan release edilmez.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334E68"/>
    </marker>
    <style>
      .title { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 31px; font-weight: 700; fill: #1F2937; }
      .label { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 20px; font-weight: 700; fill: #1F2937; }
      .cardTitle { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 19px; font-weight: 700; fill: #1F2937; }
      .cardSub { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 500; fill: #526375; }
      .badge { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .miniLabel { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 15px; font-weight: 700; fill: #1F2937; }
      .small { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 14px; font-weight: 600; fill: #526375; }
      .chip { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 14px; font-weight: 700; fill: #1F2937; }
      .note { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 17px; font-weight: 500; fill: #526375; }
      .lane { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>
  <rect x="0" y="0" width="1400" height="590" fill="#FFFFFF"/>
  <text x="700.0" y="56" text-anchor="middle" class="title">Değişiklik Yönetimi Akışı</text>
<rect x="330" y="105" width="740" height="82" rx="8" fill="#EAF2F8" stroke="#2E5D7D" stroke-width="2"/>
<circle cx="361" cy="136" r="18" fill="#24475F"/>
<text x="361" y="142" text-anchor="middle" class="badge">1</text>
<text text-anchor="middle" class="cardTitle"><tspan x="700.0" y="141.9">Değişiklik Talebi</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="700.0" y="164.04">problem, gerekçe, kabul kriteri</tspan></text>
<line x1="700" y1="193" x2="700" y2="212" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="330" y="220" width="740" height="82" rx="8" fill="#FFF7E8" stroke="#D18A1E" stroke-width="2"/>
<circle cx="361" cy="251" r="18" fill="#9A6514"/>
<text x="361" y="257" text-anchor="middle" class="badge">2</text>
<text text-anchor="middle" class="cardTitle"><tspan x="700.0" y="256.9">Etki Analizi</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="700.0" y="279.04">mobil, API, DB, worker ve artifact etkisi</tspan></text>
<line x1="700" y1="308" x2="700" y2="327" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="330" y="335" width="740" height="82" rx="8" fill="#EAF7F0" stroke="#2C8B5F" stroke-width="2"/>
<circle cx="361" cy="366" r="18" fill="#1F6746"/>
<text x="361" y="372" text-anchor="middle" class="badge">3</text>
<text text-anchor="middle" class="cardTitle"><tspan x="700.0" y="371.9">Uygulama + Test</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="700.0" y="394.04">fixture karşılaştırma ve regresyon kontrolü</tspan></text>
<line x1="700" y1="423" x2="700" y2="442" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="330" y="450" width="740" height="82" rx="8" fill="#EEF0FF" stroke="#5056D6" stroke-width="2"/>
<circle cx="361" cy="481" r="18" fill="#383DA8"/>
<text x="361" y="487" text-anchor="middle" class="badge">4</text>
<text text-anchor="middle" class="cardTitle"><tspan x="700.0" y="486.9">Review + Release</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="700.0" y="509.04">release notu ve rollback planı</tspan></text>
<rect x="435" y="285" width="88" height="34" rx="17" fill="#EAF2F8" stroke="#2E5D7D" stroke-width="1.7"/>
<text x="479.0" y="308" text-anchor="middle" class="chip">Mobil</text>
<rect x="543" y="285" width="88" height="34" rx="17" fill="#FFF7E8" stroke="#D18A1E" stroke-width="1.7"/>
<text x="587.0" y="308" text-anchor="middle" class="chip">API</text>
<rect x="651" y="285" width="88" height="34" rx="17" fill="#EAF7F0" stroke="#2C8B5F" stroke-width="1.7"/>
<text x="695.0" y="308" text-anchor="middle" class="chip">DB</text>
<rect x="759" y="285" width="88" height="34" rx="17" fill="#EEF0FF" stroke="#5056D6" stroke-width="1.7"/>
<text x="803.0" y="308" text-anchor="middle" class="chip">Worker</text>
<rect x="867" y="285" width="88" height="34" rx="17" fill="#FDECEC" stroke="#D33C3C" stroke-width="1.7"/>
<text x="911.0" y="308" text-anchor="middle" class="chip">Artifact</text>
<text text-anchor="middle" class="note"><tspan x="700.0" y="552.0">Her değişiklik katman etkisiyle birlikte test edilir ve geri dönüş planı olmadan release edilmez.</tspan></text>
</svg>
