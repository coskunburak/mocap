<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="570" viewBox="0 0 1400 570" role="img" aria-labelledby="sekil-4-3-title sekil-4-3-desc">
  <title id="sekil-4-3-title">Processing Job Durum Akışı ve Ekran Geçişleri</title>
  <desc id="sekil-4-3-desc">Başarılı job ExportResult ekranına yönlenir; hata veya iptal terminal durumda ayrı gösterilir.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334E68"/>
    </marker>
    <style>
      .title { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 31px; font-weight: 700; fill: #1F2937; }
      .label { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 20px; font-weight: 700; fill: #1F2937; }
      .cardTitle { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 19px; font-weight: 700; fill: #1F2937; }
      .cardSub { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 500; fill: #526375; }
      .badge { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .miniLabel { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 15px; font-weight: 700; fill: #1F2937; }
      .small { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 14px; font-weight: 600; fill: #526375; }
      .chip { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 14px; font-weight: 700; fill: #1F2937; }
      .note { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 17px; font-weight: 500; fill: #526375; }
      .lane { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>
  <rect x="0" y="0" width="1400" height="570" fill="#FFFFFF"/>
  <text x="700.0" y="56" text-anchor="middle" class="title">Processing Job Durum Akışı ve Ekran Geçişleri</text>
<rect x="80" y="120" width="150" height="74" rx="8" fill="#EAF2F8" stroke="#2E5D7D" stroke-width="2"/>
<text text-anchor="middle" class="cardTitle"><tspan x="155.0" y="160.7">Queued</tspan></text>
<rect x="280" y="120" width="150" height="74" rx="8" fill="#FFF7E8" stroke="#D18A1E" stroke-width="2"/>
<text text-anchor="middle" class="cardTitle"><tspan x="355.0" y="160.7">Ingesting</tspan></text>
<rect x="480" y="120" width="180" height="74" rx="8" fill="#EAF7F0" stroke="#2C8B5F" stroke-width="2"/>
<text text-anchor="middle" class="cardTitle"><tspan x="570.0" y="149.2">Extracting</tspan><tspan x="570.0" y="172.2">Frames</tspan></text>
<rect x="720" y="120" width="180" height="74" rx="8" fill="#EEF0FF" stroke="#5056D6" stroke-width="2"/>
<text text-anchor="middle" class="cardTitle"><tspan x="810.0" y="149.2">Solving</tspan><tspan x="810.0" y="172.2">Motion</tspan></text>
<rect x="820" y="235" width="170" height="74" rx="8" fill="#E8F7F8" stroke="#1B7F8C" stroke-width="2"/>
<text text-anchor="middle" class="cardTitle"><tspan x="905.0" y="275.7">Cleaning</tspan></text>
<rect x="480" y="350" width="170" height="74" rx="8" fill="#F4ECFF" stroke="#7657C7" stroke-width="2"/>
<text text-anchor="middle" class="cardTitle"><tspan x="565.0" y="390.7">Exporting</tspan></text>
<rect x="720" y="350" width="170" height="74" rx="8" fill="#EAF7F0" stroke="#2C8B5F" stroke-width="2"/>
<text text-anchor="middle" class="cardTitle"><tspan x="805.0" y="390.7">Succeeded</tspan></text>
<rect x="960" y="350" width="210" height="74" rx="8" fill="#F5F7FA" stroke="#526173" stroke-width="2"/>
<text text-anchor="middle" class="cardTitle"><tspan x="1065.0" y="390.7">ExportResult</tspan></text>
<rect x="710" y="450" width="200" height="58" rx="8" fill="#FDECEC" stroke="#D33C3C" stroke-width="2"/>
<text text-anchor="middle" class="cardTitle"><tspan x="810.0" y="481.9">Failed / Canceled</tspan></text>
<line x1="238" y1="157" x2="270" y2="157" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="438" y1="157" x2="470" y2="157" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="668" y1="157" x2="710" y2="157" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 812 197 L 873 228" fill="none" stroke="#334E68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 842 312 C 790 345 705 360 660 382" fill="none" stroke="#334E68" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<line x1="660" y1="387" x2="710" y2="387" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="900" y1="387" x2="950" y2="387" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<path d="M 805 426 L 805 442" fill="none" stroke="#334E68" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<text text-anchor="middle" class="note"><tspan x="700.0" y="532.0">Başarılı job ExportResult ekranına yönlenir; hata veya iptal terminal durumda ayrı gösterilir.</tspan></text>
</svg>
