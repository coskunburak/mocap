<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img" aria-labelledby="sekil-2-1-title sekil-2-1-desc">
  <title id="sekil-2-1-title">Sistem Mimarisi Blok Diyagramı</title>
