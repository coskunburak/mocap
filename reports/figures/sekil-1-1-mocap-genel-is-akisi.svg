<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400" role="img" aria-labelledby="sekil-1-1-title sekil-1-1-desc">
  <title id="sekil-1-1-title">Mocap Genel İş Akışı</title>
  <desc id="sekil-1-1-desc">Mobil cihaz üzerinden yüklenen video ve metadata backend hattında işlenerek son kullanıcıya aktarılır.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334E68"/>
    </marker>
    <style>
      .title { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 31px; font-weight: 700; fill: #1F2937; }
      .label { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 20px; font-weight: 700; fill: #1F2937; }
      .cardTitle { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 19px; font-weight: 700; fill: #1F2937; }
      .cardSub { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 500; fill: #526375; }
      .badge { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
      .miniLabel { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 15px; font-weight: 700; fill: #1F2937; }
      .small { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 14px; font-weight: 600; fill: #526375; }
      .chip { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 14px; font-weight: 700; fill: #1F2937; }
      .note { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 17px; font-weight: 500; fill: #526375; }
      .lane { font-family: Arial, "Helvetica Neue", sans-serif; font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>
  <rect x="0" y="0" width="1400" height="400" fill="#FFFFFF"/>
  <text x="700.0" y="56" text-anchor="middle" class="title">Mocap Genel İş Akışı</text>
<rect x="38" y="125" width="174" height="150" rx="8" fill="#EAF2F8" stroke="#2E5D7D" stroke-width="2"/>
<circle cx="69" cy="156" r="18" fill="#24475F"/>
<text x="69" y="162" text-anchor="middle" class="badge">1</text>
<text text-anchor="middle" class="cardTitle"><tspan x="125.0" y="192.5">Mobil Cihaz</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="125.0" y="233.0">Video + metadata</tspan></text>
<line x1="222" y1="200" x2="250" y2="200" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="260" y="125" width="174" height="150" rx="8" fill="#FFF7E8" stroke="#D18A1E" stroke-width="2"/>
<circle cx="291" cy="156" r="18" fill="#9A6514"/>
<text x="291" y="162" text-anchor="middle" class="badge">2</text>
<text text-anchor="middle" class="cardTitle"><tspan x="347.0" y="192.5">S3 Depolama</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="347.0" y="223.0">İmzalı upload</tspan><tspan x="347.0" y="243.0">URL</tspan></text>
<line x1="444" y1="200" x2="472" y2="200" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="482" y="125" width="174" height="150" rx="8" fill="#EAF7F0" stroke="#2C8B5F" stroke-width="2"/>
<circle cx="513" cy="156" r="18" fill="#1F6746"/>
<text x="513" y="162" text-anchor="middle" class="badge">3</text>
<text text-anchor="middle" class="cardTitle"><tspan x="569.0" y="192.5">Backend API</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="569.0" y="223.0">Processing job</tspan><tspan x="569.0" y="243.0">+ worker</tspan></text>
<line x1="666" y1="200" x2="694" y2="200" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="704" y="125" width="174" height="150" rx="8" fill="#EEF0FF" stroke="#5056D6" stroke-width="2"/>
<circle cx="735" cy="156" r="18" fill="#383DA8"/>
<text x="735" y="162" text-anchor="middle" class="badge">4</text>
<text text-anchor="middle" class="cardTitle"><tspan x="791.0" y="181.0">WHAM / SMPL</tspan><tspan x="791.0" y="204.0">Solve</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="791.0" y="233.0">3B hareket</tspan></text>
<line x1="888" y1="200" x2="916" y2="200" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="926" y="125" width="174" height="150" rx="8" fill="#FDECEC" stroke="#D33C3C" stroke-width="2"/>
<circle cx="957" cy="156" r="18" fill="#9F2D2D"/>
<text x="957" y="162" text-anchor="middle" class="badge">5</text>
<text text-anchor="middle" class="cardTitle"><tspan x="1013.0" y="192.5">Cleanup</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="1013.0" y="233.0">Temizleme + BVH</tspan></text>
<line x1="1110" y1="200" x2="1138" y2="200" stroke="#334E68" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="1148" y="125" width="174" height="150" rx="8" fill="#F5F7FA" stroke="#526173" stroke-width="2"/>
<circle cx="1179" cy="156" r="18" fill="#3B4654"/>
<text x="1179" y="162" text-anchor="middle" class="badge">6</text>
<text text-anchor="middle" class="cardTitle"><tspan x="1235.0" y="181.0">Mobil Sonuç</tspan><tspan x="1235.0" y="204.0">Ekranı</tspan></text>
<text text-anchor="middle" class="cardSub"><tspan x="1235.0" y="223.0">Kalite raporu</tspan><tspan x="1235.0" y="243.0">+ indirme URL</tspan></text>
<text text-anchor="middle" class="note"><tspan x="700.0" y="362.0">Mobil cihaz üzerinden yüklenen video ve metadata backend hattında işlenerek son kullanıcıya aktarılır.</tspan></text>
</svg>
