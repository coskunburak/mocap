<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="300" viewBox="0 0 1400 300">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#345B7C"/>
    </marker>
    <style>
      .title { font-family: "Times New Roman", Times, serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .step { font-family: "Times New Roman", Times, serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .sub { font-family: "Times New Roman", Times, serif; font-size: 17px; fill: #4B5563; }
      .num { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="300" fill="#FFFFFF"/>
  <text x="700" y="42" text-anchor="middle" class="title">Kullanılan Yöntem Akışı</text>

  <g transform="translate(45 86)">
    <g>
      <rect x="0" y="0" width="160" height="130" rx="10" fill="#E8F1F8" stroke="#345B7C" stroke-width="2"/>
      <circle cx="24" cy="25" r="16" fill="#345B7C"/>
      <text x="24" y="31" text-anchor="middle" class="num">1</text>
      <text x="80" y="60" text-anchor="middle" class="step">
        <tspan x="80" dy="0">Mobil Video</tspan>
        <tspan x="80" dy="28">Kaydı</tspan>
      </text>
      <text x="80" y="110" text-anchor="middle" class="sub">kaynak hareket</text>
    </g>

    <line x1="170" y1="65" x2="212" y2="65" stroke="#345B7C" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(225 0)">
      <rect x="0" y="0" width="160" height="130" rx="10" fill="#FFF4E5" stroke="#B7791F" stroke-width="2"/>
      <circle cx="24" cy="25" r="16" fill="#B7791F"/>
      <text x="24" y="31" text-anchor="middle" class="num">2</text>
      <text x="80" y="60" text-anchor="middle" class="step">
        <tspan x="80" dy="0">Metadata</tspan>
        <tspan x="80" dy="28">Oluşturma</tspan>
      </text>
      <text x="80" y="110" text-anchor="middle" class="sub">mocap.capture.v1</text>
    </g>

    <line x1="395" y1="65" x2="437" y2="65" stroke="#345B7C" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(450 0)">
      <rect x="0" y="0" width="160" height="130" rx="10" fill="#E7F6EF" stroke="#2F855A" stroke-width="2"/>
      <circle cx="24" cy="25" r="16" fill="#2F855A"/>
      <text x="24" y="31" text-anchor="middle" class="num">3</text>
      <text x="80" y="60" text-anchor="middle" class="step">
        <tspan x="80" dy="0">Backend</tspan>
        <tspan x="80" dy="28">Upload</tspan>
      </text>
      <text x="80" y="110" text-anchor="middle" class="sub">signed URL</text>
    </g>

    <line x1="620" y1="65" x2="662" y2="65" stroke="#345B7C" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(675 0)">
      <rect x="0" y="0" width="160" height="130" rx="10" fill="#EEF2FF" stroke="#4C51BF" stroke-width="2"/>
      <circle cx="24" cy="25" r="16" fill="#4C51BF"/>
      <text x="24" y="31" text-anchor="middle" class="num">4</text>
      <text x="80" y="60" text-anchor="middle" class="step">
        <tspan x="80" dy="0">WHAM / SMPL</tspan>
        <tspan x="80" dy="28">Solve</tspan>
      </text>
      <text x="80" y="110" text-anchor="middle" class="sub">3B hareket</text>
    </g>

    <line x1="845" y1="65" x2="887" y2="65" stroke="#345B7C" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(900 0)">
      <rect x="0" y="0" width="160" height="130" rx="10" fill="#FEF2F2" stroke="#C53030" stroke-width="2"/>
      <circle cx="24" cy="25" r="16" fill="#C53030"/>
      <text x="24" y="31" text-anchor="middle" class="num">5</text>
      <text x="80" y="60" text-anchor="middle" class="step">
        <tspan x="80" dy="0">Motion</tspan>
        <tspan x="80" dy="28">Cleanup</tspan>
      </text>
      <text x="80" y="110" text-anchor="middle" class="sub">temizleme</text>
    </g>

    <line x1="1070" y1="65" x2="1112" y2="65" stroke="#345B7C" stroke-width="4" marker-end="url(#arrow)"/>

    <g transform="translate(1125 0)">
      <rect x="0" y="0" width="160" height="130" rx="10" fill="#F7FAFC" stroke="#4A5568" stroke-width="2"/>
      <circle cx="24" cy="25" r="16" fill="#4A5568"/>
      <text x="24" y="31" text-anchor="middle" class="num">6</text>
      <text x="80" y="55" text-anchor="middle" class="step">
        <tspan x="80" dy="0">Quality</tspan>
        <tspan x="80" dy="28">Report</tspan>
        <tspan x="80" dy="28">+ BVH Export</tspan>
      </text>
    </g>
  </g>

  <text x="700" y="270" text-anchor="middle" class="sub">Mobil kayıt ve metadata bilgisi backend üzerinde WHAM/SMPL tabanlı animasyon çıktısına dönüştürülür.</text>
</svg>
