services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mocapexpo
      POSTGRES_USER: mocap
      POSTGRES_PASSWORD: mocap
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocap -d mocapexpo"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mocap
      MINIO_ROOT_PASSWORD: mocapdev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 mocap mocapdev &&
      (mc mb -p local/mocapexpo-dev || true) &&
      mc anonymous set none local/mocapexpo-dev
      "

volumes:
  postgres_data:
  minio_data:
